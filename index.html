<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Menu Builder for Glovo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column in three numbered steps (your details, products, send); large type and tap targets for partners who rarely use web forms */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1d2421; --muted:#5f6b66; --line:#d9ddd8;
  --accent:#0f6b55; --accent-ink:#ffffff; --accent-soft:#e1efe9;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Bricolage Grotesque","Noto Sans Georgian","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --ink:#e8ece9; --muted:#9aa7a1; --line:#2f3935;
  --accent:#4cc3a0; --accent-ink:#0b1512; --accent-soft:#1d3a31;
  --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#f2918a; --bad-soft:#3d1f1d; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --ink:#e8ece9; --muted:#9aa7a1; --line:#2f3935;
  --accent:#4cc3a0; --accent-ink:#0b1512; --accent-soft:#1d3a31;
  --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#f2918a; --bad-soft:#3d1f1d; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:clamp(28px,6vw,36px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
h2{font-family:var(--display);font-size:21px;margin:0;display:flex;align-items:center;gap:10px}
.step{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font:700 16px var(--body)}
.stephead{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.stephead .sub{margin:0}
.hint{font-size:13px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3 .shopname{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.lab{font-size:14px;font-weight:600;color:var(--ink)}
.lab b{color:var(--bad);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible,.photo:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.invalid{border-color:var(--bad)!important;background:var(--bad-soft)}
.items{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:150px 1fr;gap:16px}
.num{font:600 14px var(--body);color:var(--muted);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.photos{display:flex;flex-direction:column;gap:6px}
.photo{position:relative;aspect-ratio:1;width:100%;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;padding:8px;overflow:hidden}
.photo.has{border-style:solid;padding:0;background:#fff}
.photo img{width:100%;height:100%;object-fit:contain}
.photo.drag{border-color:var(--accent);background:var(--accent-soft)}
.plus{display:block;font-size:34px;line-height:1;color:var(--accent);margin-bottom:4px}
.chip{position:absolute;left:4px;bottom:4px;max-width:calc(100% - 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 10px var(--body);padding:2px 6px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.thumbs{display:flex;gap:4px;flex-wrap:wrap}
.thumbs .t{position:relative;width:38px;height:38px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:#fff}
.thumbs .t img{width:100%;height:100%;object-fit:contain}
.thumbs .t button{position:absolute;inset:0;opacity:0;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;cursor:pointer}
.thumbs .t button:hover,.thumbs .t button:focus-visible{opacity:1}
.linkbtn{border:0;background:none;color:var(--accent);font:600 14px var(--body);padding:6px 0;cursor:pointer;text-align:left}
.fields{display:grid;grid-template-columns:1fr 140px;gap:14px;min-width:0}
.fields .wide{grid-column:1/-1}
.pricebox{position:relative}
.pricebox input{padding-right:34px;font-variant-numeric:tabular-nums}
.pricebox span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.count{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.count.over{color:var(--bad);font-weight:600}
.rowfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.msg{font-size:14px;font-weight:500;color:var(--bad)}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);font:500 14px var(--body);padding:10px 16px;border-radius:10px;cursor:pointer}
.danger{border:0;background:var(--bad);color:#fff;font:600 14px var(--body);padding:10px 16px;border-radius:10px;cursor:pointer}
.delask{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:500}
.ghost:hover{color:var(--bad);border-color:var(--bad)}
.add{border:2px dashed var(--accent);background:transparent;color:var(--accent);font:600 17px var(--body);padding:18px;border-radius:14px;cursor:pointer;width:100%}
.add:hover{background:var(--accent-soft)}
.summary{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.summary strong{color:var(--ink)}
.summary .bad{color:var(--bad);font-weight:600}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font:600 16px var(--body);padding:13px 22px;border-radius:12px;cursor:pointer}
.big{font-size:19px;padding:18px 28px;width:100%}
.primary:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghost2{border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:600 15px var(--body);padding:12px 18px;border-radius:12px;cursor:pointer}
.ghost2:disabled{opacity:.5;cursor:default}
.done{border-color:var(--accent);background:var(--accent-soft)}
.reset{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sendbox{display:flex;flex-direction:column;gap:14px}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--ink);border:1px solid transparent}
.notice strong{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:12px;font-size:16px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:6;width:min(520px,calc(100% - 32px));text-align:center}
.settings input{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.crop{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.72);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cropcard{background:var(--surface);border-radius:16px;padding:16px;width:min(440px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.cropcard h3{font-family:var(--display);font-size:18px;margin:0}
.cropcard p{margin:0;color:var(--muted);font-size:15px}
#cropCanvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;background:#fff;touch-action:none;cursor:grab;display:block;outline:1px solid var(--line)}
#cropCanvas:active{cursor:grabbing}
.cropstage{position:relative}
.cropcard p.lowres{color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.busy{position:absolute;inset:0;border-radius:10px;background:rgba(255,255,255,.82);color:#1d2421;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;font-weight:500}
.bgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:500 14px var(--body);padding:10px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.5;cursor:default}
.swatches{display:flex;gap:6px}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.zoomrow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:18px}
.zoomrow input{flex:1;padding:0;accent-color:var(--accent);background:none;border:0}
.cropbtns{display:flex;justify-content:flex-end;gap:8px}
@media (max-width:620px){
  .grid3{grid-template-columns:1fr}
  .item{grid-template-columns:1fr;gap:12px;padding:14px}
  .photos{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;align-items:start}
  .photos .num{grid-column:1/-1}
  .photos .photo{grid-row:span 2}
  .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="intro"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ka" data-lang="ka">ქარ</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
  </header>

  <div class="notice" id="hostNotice" hidden></div>

  <section class="panel settings" id="settings" hidden>
    <h2>Photo hosting key</h2>
    <p class="sub" style="margin:0 0 10px">Free key from api.imgbb.com. It is saved in this browser only. Put it in the IMGBB_KEY line of the file before you host the page for partners.</p>
    <input id="keyInput" placeholder="imgbb API key" autocomplete="off">
  </section>

  <section class="panel">
    <div class="stephead"><h2><span class="step">1</span><span data-t="shop"></span></h2></div>
    <div class="grid3">
      <label class="f shopname"><span class="lab"><span data-t="shopName"></span> <b>*</b></span><input id="shopName" autocomplete="organization"></label>
      <label class="f"><span class="lab"><span data-t="email"></span> <b>*</b></span><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com"><span class="hint" data-t="emailHint"></span></label>
      <label class="f"><span class="lab"><span data-t="phone"></span> <b>*</b></span><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="5XX XX XX XX"></label>
    </div>
  </section>

  <section>
    <div class="stephead"><h2><span class="step">2</span><span data-t="products"></span></h2><p class="sub" data-t="productsHint"></p></div>
    <div class="items" id="items"></div>
    <datalist id="sectionList"></datalist>
  </section>
  <button type="button" class="add" id="addBtn"></button>

  <section class="panel sendbox" id="sendPanel">
    <div class="stephead" style="margin:0"><h2><span class="step">3</span><span data-t="sendTitle"></span></h2><p class="sub" data-t="sendHint"></p></div>
    <div class="summary" id="summary"></div>
    <button type="button" class="primary big" id="exportBtn"></button>
  </section>
  <section class="panel done" id="donePanel" hidden>
    <div class="stephead"><h2 data-t="sentTitle"></h2><p class="sub" data-t="sentText"></p></div>
    <div class="actions"><button type="button" class="ghost2" id="downloadBtn"></button><button type="button" class="primary" id="newMenuBtn2" data-t="newMenu"></button></div>
  </section>
  <div class="reset" id="resetRow">
    <button type="button" class="linkbtn" id="resetBtn" data-t="newMenu"></button>
    <span id="resetConfirm" hidden><span data-t="resetAsk"></span> <button type="button" class="ghost" id="resetYes" data-t="resetYes"></button> <button type="button" class="ghost" id="resetNo" data-t="cancel"></button></span>
  </div>
</div>

<!-- Netlify Forms reads this hidden form when the site is deployed; the page posts the finished menu to it. -->
<form name="menu-submission" method="POST" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="venue"><input name="email"><input name="phone"><input name="products"><textarea name="product-list"></textarea><input name="bot-field"><input type="file" name="excel">
</form>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<div class="crop" id="crop" hidden role="dialog" aria-modal="true" aria-labelledby="cropTitle">
  <div class="cropcard">
    <h3 id="cropTitle" data-t="cropTitle"></h3>
    <p data-t="cropHint"></p>
    <div class="bgrow" id="bgRow">
      <span class="lab" data-t="background"></span>
      <div class="seg" role="group"><button type="button" id="bgKeep" data-t="bgKeep"></button><button type="button" id="bgRemove" data-t="bgRemove"></button></div>
      <div class="swatches" id="swatches" hidden><button type="button" class="sw" data-c="#ffffff" style="background:#ffffff" aria-label="White"></button><button type="button" class="sw" data-c="#f1f1ef" style="background:#f1f1ef" aria-label="Light grey"></button></div>
    </div>
    <div class="cropstage"><canvas id="cropCanvas" width="540" height="540"></canvas><div class="busy" id="busy" hidden></div></div>
    <p class="lowres" id="lowRes" data-t="lowRes" hidden></p>
    <div class="zoomrow"><span aria-hidden="true">−</span><input type="range" id="zoom" min="0" max="1000" value="0" aria-label="Zoom"><span aria-hidden="true">+</span></div>
    <div class="cropbtns"><button type="button" class="ghost" id="cropCancel" data-t="cancel"></button><button type="button" class="primary" id="cropOk" data-t="usePhoto"></button></div>
  </div>
</div>

function loadImage(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{res(im);}; im.onerror=rej; im.src=u; }); }

// it opens filled edge to edge (center crop). Zooming out shows the whole photo, with the empty edges filled by a

const OUT = 540, F = 540;

function edgeColor(im){

function halvedFor(im, scale){

function zoomTo(s, cx=F/2, cy=F/2){

function setMode(mode){

// Clean the cut-out: drop faint pixels and stray specks (keep only blobs at least 10% the size of the main one),
// then trim the transparent edges so every product is centered the same way.
function cleanCutout(img){

  const g = c.getContext("2d"); g.drawImage(img,0,0); const id = g.getImageData(0,0,w,h), d = id.data;

    sizes.push(n); }

  const near = new Uint8Array(gw*gh);

    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy; if(xx>=0&&yy>=0&&xx<gw&&yy<gh) near[yy*gw+xx]=1; } }
  let x0=w, y0=h, x1=-1, y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const a=(y*w+x)*4+3; if(!d[a]) continue;
    if(!near[((y/cell)|0)*gw+((x/cell)|0)]){ d[a]=0; continue; }
    if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }

  const o = document.createElement("canvas"); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext("2d").drawImage(c,-x0,-y0); return o;
}
let bgLib = null;
async function removeBg(){
  if(crop.cut){ setMode("cut"); return; }
  const src = crop.src, busy = $("#busy"); busy.textContent = t("removing"); busy.hidden = false; $("#cropOk").disabled = true; $("#bgRemove").disabled = true;
  try{
    bgLib = bgLib || await import(new URL(BG_LIB, location.href).href);
    const blob = await new Promise(r=>{ const c=document.createElement("canvas"); const [w,h]=dims(crop.src); const k=Math.min(1, 1600/Math.max(w,h));
      c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext("2d").drawImage(crop.src,0,0,c.width,c.height); c.toBlob(r,"image/png"); });
    const out = await bgLib.removeBackground(blob, {model:"small", publicPath:BG_DATA, output:{format:"image/png"}});
    if(!crop.done || crop.src!==src) return;
    crop.cut = cleanCutout(await loadImage(out));
    setMode("cut");
  }catch(e){ console.warn("background removal failed", e); toast(t("bgFailed")); }
  finally{ if(crop.src!==src) return; busy.hidden = true; $("#cropOk").disabled = false; $("#bgRemove").disabled = false; }
}

  const pt = e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*F/r.width, y:(e.clientY-r.top)*F/r.height}; };
  cv.addEventListener("pointerdown", e=>{ cv.setPointerCapture(e.pointerId); const p=pt(e); drag={x:p.x-crop.x, y:p.y-crop.y}; });
  cv.addEventListener("pointermove", e=>{ if(!drag) return; const p=pt(e); crop.x=p.x-drag.x; crop.y=p.y-drag.y; cropClamp(); cropRender(); });
  cv.addEventListener("pointerup", ()=>drag=null); cv.addEventListener("pointercancel", ()=>drag=null);
  cv.addEventListener("wheel", e=>{ e.preventDefault(); const p=pt(e); zoomTo(crop.s*Math.exp(-e.deltaY/500), p.x, p.y); $("#zoom").value=scaleToSlider(crop.s); }, {passive:false});
  $("#zoom").addEventListener("input", e=>zoomTo(sliderToScale(+e.target.value)));
  $("#bgKeep").onclick = ()=>setMode("keep"); $("#bgRemove").onclick = removeBg;
  document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{ crop.color=b.dataset.c; setMode("cut"); });
  $("#cropOk").onclick = ()=>cropClose(true); $("#cropCancel").onclick = ()=>cropClose(false);
  document.addEventListener("keydown", e=>{ if(!$("#crop").hidden){ if(e.key==="Escape") cropClose(false); if(e.key==="Enter" && e.target.tagName!=="BUTTON" && !$("#cropOk").disabled) cropClose(true); } });
})();
async function addPhotos(item, files){
  for(const f of files){
    if(!f.type.startsWith("image/")) continue;
    let im; try{ im = await loadImage(f); }catch(e){ toast(f.name+": ?"); continue; }
    const r = await cropDialog(im); if(!r) continue;
    const p = {id:uid(), data:r.data, thumb:r.thumb, url:"", status:"local"};
    item.photos.push(p);
    renderItems(); save();
    upload(item, p);
  }
}
async function viaImgbb(key, data, name){
  const fd = new FormData();
  fd.append("image", data.split(",")[1]);
  fd.append("name", name);
  const r = await fetch("https://api.imgbb.com/1/upload?key="+encodeURIComponent(key), {method:"POST", body:fd});
  const j = await r.json();
  if(!j.success) throw new Error(j.error && j.error.message || r.status);
  return j.data.url;
}
async function viaCloudinary(data, name){
  const fd = new FormData();
  fd.append("file", data);
  fd.append("upload_preset", CLOUDINARY_PRESET);
  const r = await fetch("https://api.cloudinary.com/v1_1/"+encodeURIComponent(CLOUDINARY_CLOUD)+"/image/upload", {method:"POST", body:fd});
  const j = await r.json();
  if(!j.secure_url) throw new Error(j.error && j.error.message || r.status);
  return j.secure_url;
}
async function upload(item, p){
  const key = apiKey(), cld = CLOUDINARY_CLOUD && CLOUDINARY_PRESET;
  if((!key && !cld) || inArtifact){ p.status="local"; return; }
  p.status = "uploading"; renderItems();
  const name = (state.shop.name+"-"+item.name).slice(0,60) || "product";
  try{
    try{ if(!key) throw new Error("no imgbb key"); p.url = await viaImgbb(key, p.data, name); }
    catch(e){ if(!cld) throw e; console.warn("imgbb failed, using Cloudinary", e); p.url = await viaCloudinary(p.data, name); }
    p.status = "ok"; p.data = p.thumb;
  }catch(e){ p.status = "failed"; console.warn("upload failed", e); }
  renderItems(); save();
}

/* ---------- Excel (fills the Glovo onboarding template) ---------- */
const GE_LAT = {"ა":"a","ბ":"b","გ":"g","დ":"d","ე":"e","ვ":"v","ზ":"z","თ":"t","ი":"i","კ":"k","ლ":"l","მ":"m","ნ":"n","ო":"o","პ":"p","ჟ":"zh","რ":"r","ს":"s","ტ":"t","უ":"u","ფ":"p","ქ":"k","ღ":"gh","ყ":"q","შ":"sh","ჩ":"ch","ც":"ts","ძ":"dz","წ":"ts","ჭ":"ch","ხ":"kh","ჯ":"j","ჰ":"h"};
function slug(s){ return [...s.toLowerCase()].map(c=>GE_LAT[c]??c).join("").normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "shop"; }
function xml(s){ return esc(String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").trim()); }
const str = (ref,v,s) => v===""||v==null ? `<c r="${ref}"${s?` s="${s}"`:""}/>` : `<c r="${ref}"${s?` s="${s}"`:""} t="inlineStr"><is><t xml:space="preserve">${xml(v)}</t></is></c>`;
const num = (ref,v,s) => `<c r="${ref}" s="${s}"><v>${v}</v></c>`;
// Sod's layout drops the template's Unit/Step and Discounted Price columns, so products fill A-I and the rest stay styled blanks up to AL.
const FILL = ["J","K","L","M","N","O","P","Q","R","S","T","U","V","W","X","Y","Z","AA","AB","AC","AD","AE","AF","AG","AH","AI","AJ","AK","AL"];

async function buildXlsx(items){
  const zip = await JSZip.loadAsync(TEMPLATE_B64, {base64:true});
  const path = "xl/worksheets/sheet1.xml";
  let s = await zip.file(path).async("string");
  const base = slug(state.shop.name);
  s = s.replace('<c r="B2" s="3"/>', str("B2", base, 3))
       .replace('<c r="C2" s="5"/>', str("C2", COUNTRY, 5));
  const rows = items.map((it,i)=>{
    const r = 6+i;
    return `<row r="${r}" spans="1:38" ht="26.25" customHeight="1">`
      + str("A"+r,"Standard",20) + str("B"+r, base.replace(/-/g,"")+(i+1), 21) + `<c r="C${r}" s="22"/>`
      + str("D"+r,it.name) + str("E"+r,it.photos.map(p=>p.url).filter(Boolean).join(",")) + str("F"+r,it.desc)
      + num("G"+r,parsePrice(it.price),26) + num("H"+r,1,27) + str("I"+r,(it.section||"").trim(),23)
      + FILL.map(c=>`<c r="${c}${r}" s="3"/>`).join("") + `</row>`;
  }).join("");
  s = s.replace("</sheetData>", rows + "</sheetData>").replace('<dimension ref="A1:AL5"/>', `<dimension ref="A1:AL${5+items.length}"/>`);
  zip.file(path, s);
  return zip.generateAsync({type:"uint8array", compression:"DEFLATE", mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
// Checks everything and returns the finished workbook, or null after pointing the partner at what to fix.
async function finishedWorkbook(){
  showErrors = true;
  if(!state.shop.name.trim()){ $("#shopName").classList.add("invalid"); $("#shopName").focus(); toast(t("needShop")); return null; }
  if(!validEmail(state.shop.email)){ $("#email").classList.add("invalid"); $("#email").focus(); toast(t("needEmail")); return null; }
  if(!validPhone(state.shop.phone)){ $("#phone").classList.add("invalid"); $("#phone").focus(); toast(t("needPhone")); return null; }
  const items = state.items.filter(i=>!isBlank(i));
  if(items.some(i=>i.photos.some(p=>p.status==="uploading"))){ toast(t("waitUploads")); return null; }
  const bad = items.filter(i=>problems(i).length);
  renderItems();
  if(bad.length){ toast(t("fixFirst", bad.length)); document.querySelector(`[data-id="${bad[0].id}"]`)?.scrollIntoView({behavior:"smooth",block:"center"}); return null; }
  return {items, bytes: await buildXlsx(items), filename:`${slug(state.shop.name)}_glovo_menu.xlsx`};
}
async function downloadExcel(){
  const wb = await finishedWorkbook(); if(!wb) return;
  const {bytes, filename} = wb;
  if(inArtifact){
    const dl = await window.claude.use("downloads");
    if(!dl){ toast("Download is not available here"); return; }
    try{ await dl.save({filename, data:bytes}); toast(t("saved")); }
    catch(e){ toast(e && e.code==="declined" ? t("declined") : (e && e.message) || "Download failed"); }
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000); toast(t("saved"));
  }
}
// Finished menus are emailed to Sod through FormSubmit (free; the first submission sends Sod an activation email).
// A copy also goes to Netlify Forms when form detection is on for the site. Either one arriving counts as sent.
const SEND_TO = "gecategorymanagers@glovoapp.com";
// Google Apps Script web app (google-apps-script.gs on Sod's Google account). When set, it is used instead of
// FormSubmit: it emails the Excel as an attachment, keeps a copy in Drive and reports real success or failure.
const MAIL_URL = "";
function toBase64(bytes){ let s = ""; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s); }
async function emailViaAppsScript(payload){
  // text/plain keeps this a simple request, so the browser sends it without a CORS preflight Apps Script cannot answer
  const r = await fetch(MAIL_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
  const j = await r.json().catch(()=>({}));
  if(!j.ok) throw new Error(j.error || ("HTTP "+r.status));
}
function emailViaFormSubmit(fields, file){
  // FormSubmit takes attachments only from a regular form post, so post a hidden form into a hidden frame.
  return new Promise((resolve, reject)=>{
    const name = "fs" + Date.now(), frame = document.createElement("iframe"), form = document.createElement("form");
    frame.name = name; frame.hidden = true; document.body.appendChild(frame);
    Object.assign(form, {method:"POST", enctype:"multipart/form-data", action:"https://formsubmit.co/"+encodeURIComponent(SEND_TO), target:name, hidden:true});
    for(const [k,v] of Object.entries(fields)){ const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = v; form.appendChild(i); }
    const fi = document.createElement("input"); fi.type = "file"; fi.name = "attachment";
    const dt = new DataTransfer(); dt.items.add(file); fi.files = dt.files; form.appendChild(fi);
    document.body.appendChild(form);
    const done = ok=>{ clearTimeout(timer); setTimeout(()=>{ frame.remove(); form.remove(); }, 1000); ok ? resolve() : reject(new Error("email timeout")); };
    const timer = setTimeout(()=>done(false), 45000);
    frame.addEventListener("load", ()=>done(true), {once:true});
    form.submit();
  });
}
async function saveToNetlify(fields, file){
  const fd = new FormData(); fd.append("form-name", "menu-submission");
  for(const [k,v] of Object.entries(fields)) fd.append(k, v);
  fd.append("excel", file);
  const r = await fetch("/", {method:"POST", body:fd});
  if(!r.ok) throw new Error("HTTP "+r.status);
}
// FormSubmit does not always pass the attachment on, so the Excel also goes to Cloudinary and the email carries its link.
async function excelLink(file){
  if(!(CLOUDINARY_CLOUD && CLOUDINARY_PRESET)) return "";
  const post = async withId=>{
    const fd = new FormData();
    fd.append("file", file); fd.append("upload_preset", CLOUDINARY_PRESET);
    if(withId) fd.append("public_id", file.name.replace(/\.xlsx$/i,"")+"-"+Date.now()+".xlsx");
    const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 30000);
    try{
      const r = await fetch("https://api.cloudinary.com/v1_1/"+encodeURIComponent(CLOUDINARY_CLOUD)+"/raw/upload", {method:"POST", body:fd, signal:ctl.signal});
      const j = await r.json();
      if(!j.secure_url) throw new Error(j.error && j.error.message || r.status);
      return j.secure_url;
    } finally { clearTimeout(timer); }
  };
  try{ return await post(true); }
  catch(e){ console.warn("excel link with name failed", e); try{ return await post(false); } catch(e2){ console.warn("excel link failed", e2); return ""; } }
}
async function sendMenu(){
  if(sending) return;
  if(navigator.onLine===false){ toast(t("sendFailed")); return; }
  const wb = await finishedWorkbook(); if(!wb) return;
  sending = true; renderStatic(); renderSummary();
  try{
    const file = new File([wb.bytes], wb.filename, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const cur = CURRENCY[COUNTRY] || "";
    const list = wb.items.map((it,i)=>`${i+1}. ${it.name.trim()} - ${parsePrice(it.price)} ${cur}${(it.section||"").trim()?` (${it.section.trim()})`:""}`).join("\n");
    const venue = {venue:state.shop.name.trim(), email:state.shop.email.trim(), phone:state.shop.phone.trim(), products:String(wb.items.length)};
    if(MAIL_URL){
      await emailViaAppsScript({shop:venue.venue, email:venue.email, phone:venue.phone, count:venue.products,
        products:wb.items.map(it=>`${it.name.trim()} - ${parsePrice(it.price)} ${cur}`), filename:wb.filename, file:toBase64(wb.bytes)});
      saveToNetlify({...venue, "product-list":list}, file).catch(()=>{});
      return markSent();
    }
    const link = await excelLink(file);
    const results = await Promise.allSettled([
      // FormSubmit sets Reply-To from the "email" field, so Sod can answer the partner straight from the email.
      emailViaFormSubmit({"Shop name":venue.venue, email:venue.email, "Phone number":venue.phone, "Number of products":venue.products, "Products":list,
        "Excel file": link || "attached (no link)",
        _subject:`New Glovo menu: ${venue.venue} (${venue.products} products)`, _captcha:"false", _template:"table"}, file),
      saveToNetlify({...venue, "product-list":list}, file)
    ]);
    // The email frame cannot tell success from a dropped connection, so a network failure on the Netlify call
    // (a TypeError, not an HTTP error) means the partner is offline and nothing went out.
    if(results[1].status==="rejected" && results[1].reason instanceof TypeError) throw new Error("offline");
    if(!results.some(r=>r.status==="fulfilled")) throw results[0].reason;
    markSent();
  }catch(e){ console.warn("send failed", e); toast(t("sendFailed") + (e && e.message ? ` (${e.message})` : "")); }
  finally{ sending = false; renderStatic(); renderSummary(); }
}
function markSent(){
    state.sentAt = new Date().toISOString(); save();
    $("#donePanel").hidden = false; $("#sendPanel").hidden = true; $("#resetRow").hidden = true; $("#donePanel").scrollIntoView({behavior:"smooth", block:"center"});
}
function startNewMenu(){
  state = {shop:{name:"", email:"", phone:""}, items:[newItem()]};
  showErrors = false; save(); $("#donePanel").hidden = true; $("#sendPanel").hidden = false; $("#resetRow").hidden = false; $("#resetConfirm").hidden = true; $("#resetBtn").hidden = false;
  renderAll(); window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- events ---------- */
let toastTimer;
function toast(m){ const el=$("#toast"); el.textContent=m; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,6000); }
const itemOf = el => state.items.find(i=>i.id===el.closest(".item")?.dataset.id);

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; store.set("glovo-menu-lang",lang); renderAll(); });
$("#shopName").oninput = e=>{ state.shop.name=e.target.value; e.target.classList.remove("invalid"); save(); };
for(const k of ["email","phone"]) $("#"+k).oninput = e=>{ state.shop[k]=e.target.value; e.target.classList.remove("invalid"); save(); };
$("#addBtn").onclick = ()=>{ const it=newItem(); state.items.push(it); save(); renderItems(); document.getElementById("name-"+it.id)?.focus(); };
$("#exportBtn").onclick = ()=> canSend ? sendMenu() : downloadExcel();
$("#downloadBtn").onclick = downloadExcel;
$("#newMenuBtn2").onclick = startNewMenu;
$("#resetBtn").onclick = ()=>{ $("#resetBtn").hidden = true; $("#resetConfirm").hidden = false; };
$("#resetNo").onclick = ()=>{ $("#resetBtn").hidden = false; $("#resetConfirm").hidden = true; };
$("#resetYes").onclick = startNewMenu;

const items = $("#items");
items.addEventListener("input", e=>{
  const k = e.target.dataset.k, it = itemOf(e.target); if(!k||!it) return;
  it[k] = e.target.value; e.target.classList.remove("invalid");
  if(k==="desc"){ const c=e.target.parentElement.querySelector(".count"); c.textContent=`${it.desc.length} / ${DESC_MAX}`; c.classList.toggle("over", it.desc.length>DESC_MAX); }
  save(); renderSummary();
});
items.addEventListener("change", e=>{ if(e.target.dataset.k==="section") fillSections(); });
items.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return; const it = itemOf(b);
  const act = b.dataset.act;
  if(act==="photo"){
    const p = it.photos[0];
    if(it.photos.some(x=>x.status==="failed")){ it.photos.filter(x=>x.status==="failed").forEach(x=>upload(it,x)); return; }
    pickTarget = it; $("#fileInput").click();
  } else if(act==="more"){ pickTarget = it; $("#fileInput").click(); }
  else if(act==="rmphoto"){ it.photos.splice(+b.dataset.k,1); save(); renderItems(); }
  else if(act==="askremove"){ it.askDelete = true; renderItems(); }
  else if(act==="keep"){ delete it.askDelete; renderItems(); }
  else if(act==="remove"){ state.items = state.items.filter(x=>x!==it); save(); renderItems(); }
});
items.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("photo")){ e.preventDefault(); e.target.click(); } });
items.addEventListener("dragover", e=>{ const p=e.target.closest(".photo"); if(p){ e.preventDefault(); p.classList.add("drag"); } });
items.addEventListener("dragleave", e=>{ e.target.closest(".photo")?.classList.remove("drag"); });
items.addEventListener("drop", e=>{ const p=e.target.closest(".photo"); if(!p) return; e.preventDefault(); addPhotos(itemOf(p), [...e.dataTransfer.files]); });
$("#fileInput").onchange = e=>{ if(pickTarget) addPhotos(pickTarget,[...e.target.files]); e.target.value=""; };

// Hidden setup panel for Sod: open the page with #setup to paste the photo hosting key for testing.
function checkSetup(){ const on = location.hash==="#setup"; $("#settings").hidden=!on; if(on) $("#keyInput").value = store.get("imgbb-key")||""; }
$("#keyInput").oninput = e=>{ store.set("imgbb-key", e.target.value.trim()); renderStatic(); };
window.addEventListener("hashchange", checkSetup);
checkSetup(); renderAll();
