<title>Menu Builder for Glovo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow column in three numbered steps (your details, products, send); large type and tap targets for partners who rarely use web forms */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1d2421; --muted:#5f6b66; --line:#d9ddd8;
  --accent:#0f6b55; --accent-ink:#ffffff; --accent-soft:#e1efe9;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Bricolage Grotesque","Noto Sans Georgian","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --ink:#e8ece9; --muted:#9aa7a1; --line:#2f3935;
  --accent:#4cc3a0; --accent-ink:#0b1512; --accent-soft:#1d3a31;
  --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#f2918a; --bad-soft:#3d1f1d; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --ink:#e8ece9; --muted:#9aa7a1; --line:#2f3935;
  --accent:#4cc3a0; --accent-ink:#0b1512; --accent-soft:#1d3a31;
  --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#f2918a; --bad-soft:#3d1f1d; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:clamp(28px,6vw,36px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
h2{font-family:var(--display);font-size:21px;margin:0;display:flex;align-items:center;gap:10px}
.step{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font:700 16px var(--body)}
.stephead{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.stephead .sub{margin:0}
.hint{font-size:13px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3 .shopname{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.lab{font-size:14px;font-weight:600;color:var(--ink)}
.lab b{color:var(--bad);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible,.photo:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.invalid{border-color:var(--bad)!important;background:var(--bad-soft)}
.items{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:150px 1fr;gap:16px}
.num{font:600 14px var(--body);color:var(--muted);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.photos{display:flex;flex-direction:column;gap:6px}
.photo{position:relative;aspect-ratio:1;width:100%;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;padding:8px;overflow:hidden}
.photo.has{border-style:solid;padding:0;background:#fff}
.photo img{width:100%;height:100%;object-fit:contain}
.photo.drag{border-color:var(--accent);background:var(--accent-soft)}
.plus{display:block;font-size:34px;line-height:1;color:var(--accent);margin-bottom:4px}
.chip{position:absolute;left:4px;bottom:4px;max-width:calc(100% - 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 10px var(--body);padding:2px 6px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.thumbs{display:flex;gap:4px;flex-wrap:wrap}
.thumbs .t{position:relative;width:44px;height:44px;padding:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff;cursor:pointer}
.thumbs .t img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs .t.bad{outline:2px solid var(--bad);outline-offset:1px}
.thumbs .t.wait img{opacity:.55}
.mainbadge{position:absolute;left:4px;top:4px;font:600 10px var(--body);padding:2px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.itemhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:-4px}
.itemhead .left{display:flex;align-items:center;gap:10px}
.badge{font:600 12px var(--body);padding:3px 10px;border-radius:999px}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.need{background:var(--warn-soft);color:var(--warn)}
.move{display:flex;gap:6px}
.move button{width:40px;height:40px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:600 18px var(--body);cursor:pointer}
.move button:disabled{opacity:.35;cursor:default}
.msg.soft{color:var(--warn)}
.autosku{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skubox{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;padding:16px}
.skubox .seg{align-self:flex-start;flex-wrap:wrap}
.bulk{border:2px dashed var(--accent);display:flex;flex-direction:column;gap:12px}
.bulk.drag{background:var(--accent-soft)}
.bulk h2{font-size:19px}
.bulkstatus{display:flex;flex-direction:column;gap:8px;font-size:14px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.cropcard.wide{width:min(640px,100%)}
.pmimg{width:180px;max-width:100%;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#fff;object-fit:contain;align-self:center}
.menubtns{display:flex;flex-direction:column;gap:8px}
.menubtns button{width:100%}
.pvshop{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.pvrow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.pvrow img{width:56px;height:56px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.pvname{font-weight:600;overflow-wrap:anywhere}
.pvdesc{font-size:14px;overflow-wrap:anywhere}
.pvmeta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pvprice{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.results li{display:flex;gap:10px;align-items:flex-start}
.ic{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.ic.ok{background:var(--accent);color:var(--accent-ink)}
.ic.bad{background:var(--bad);color:#fff}
.panel.fail{border-color:var(--bad);background:var(--bad-soft)}
.linkbtn{border:0;background:none;color:var(--accent);font:600 14px var(--body);padding:6px 0;cursor:pointer;text-align:left}
.fields{display:grid;grid-template-columns:1fr 140px;gap:14px;min-width:0}
.fields .wide{grid-column:1/-1}
.pricebox{position:relative}
.pricebox input{padding-right:34px;font-variant-numeric:tabular-nums}
.pricebox span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.count{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.count.over{color:var(--bad);font-weight:600}
.rowfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.msg{font-size:14px;font-weight:500;color:var(--bad)}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);font:500 14px var(--body);padding:10px 16px;border-radius:10px;cursor:pointer}
.danger{border:0;background:var(--bad);color:#fff;font:600 14px var(--body);padding:10px 16px;border-radius:10px;cursor:pointer}
.delask{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:500}
.ghost:hover{color:var(--bad);border-color:var(--bad)}
.add{border:2px dashed var(--accent);background:transparent;color:var(--accent);font:600 17px var(--body);padding:18px;border-radius:14px;cursor:pointer;width:100%}
.add:hover{background:var(--accent-soft)}
.summary{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.summary strong{color:var(--ink)}
.summary .bad{color:var(--bad);font-weight:600}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font:600 16px var(--body);padding:13px 22px;border-radius:12px;cursor:pointer}
.big{font-size:19px;padding:18px 28px;width:100%}
.primary:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghost2{border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:600 15px var(--body);padding:12px 18px;border-radius:12px;cursor:pointer}
.ghost2:disabled{opacity:.5;cursor:default}
.done{border-color:var(--accent);background:var(--accent-soft)}
.reset{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sendbox{display:flex;flex-direction:column;gap:14px}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--ink);border:1px solid transparent}
.notice strong{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:12px;font-size:16px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:6;width:min(520px,calc(100% - 32px));text-align:center}
.settings input{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.crop{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.72);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cropcard{background:var(--surface);border-radius:16px;padding:16px;width:min(440px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.cropcard h3{font-family:var(--display);font-size:18px;margin:0}
.cropcard p{margin:0;color:var(--muted);font-size:15px}
#cropCanvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;background:#fff;touch-action:none;cursor:grab;display:block;outline:1px solid var(--line)}
#cropCanvas:active{cursor:grabbing}
.cropstage{position:relative}
.cropcard p.lowres{color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.busy{position:absolute;inset:0;border-radius:10px;background:rgba(255,255,255,.82);color:#1d2421;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;font-weight:500}
.bgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:500 14px var(--body);padding:10px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.5;cursor:default}
.swatches{display:flex;gap:6px}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.zoomrow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:18px}
.zoomrow input{flex:1;padding:0;accent-color:var(--accent);background:none;border:0}
.cropbtns{display:flex;justify-content:flex-end;gap:8px}
@media (max-width:620px){
  .grid3{grid-template-columns:1fr}
  .item{grid-template-columns:1fr;gap:12px;padding:14px}
  .photos{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;align-items:start}
  .photos .num{grid-column:1/-1}
  .photos .photo{grid-row:span 4}
  .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* Graphite design: near-black page, dark cards, Glovo yellow for actions and the headline accent.
   The yellow dots and green wave sit only in the empty side margins, never behind text. */
:root,:root[data-theme],:root:not([data-theme="light"]){
  --bg:#1e1f22; --surface:#2a2b2f; --field:#34363a; --ink:#f0f0ec; --head:#ffffff; --muted:#c3c4be; --line:#4a4c52;
  --accent:#ffc244; --accent-ink:#1e1f22; --accent-soft:#3d3420; --green:#00a082;
  --warn:#f5bd61; --warn-soft:#3b2e16; --bad:#ff958c; --bad-soft:#4a2421;
  --display:"Noto Sans Georgian","Poppins",system-ui,sans-serif;
  --body:"Noto Sans Georgian","Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink)}
.wrap{position:relative;z-index:1}
h1{font-family:var(--display);font-weight:800;color:var(--head);font-size:clamp(32px,7vw,54px);line-height:1.22;letter-spacing:0}
h1 .accent{color:var(--accent)}
h2{font-family:var(--display);font-weight:700;color:var(--head)}
.sub,.hint{color:var(--muted)}
.panel,.item{background:var(--surface);border-color:var(--line);border-radius:18px}
input,select,textarea{background:var(--field);border-color:var(--line);color:var(--ink)}
input::placeholder,textarea::placeholder{color:#a3a49e;opacity:1}
.photo{background:var(--field);border-color:var(--line);color:var(--ink)}
.step{background:var(--accent);color:var(--accent-ink);font-weight:800}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px}
.ghost2{border-color:var(--accent);color:var(--accent);background:transparent;border-radius:999px}
.ghost{border-color:var(--line);color:var(--ink);border-radius:999px}
.ghost:hover{color:var(--bad);border-color:var(--bad)}
.danger{background:var(--bad);color:#1e1f22;border-radius:999px}
.add{border-color:var(--accent);color:var(--accent);border-radius:999px}
.add:hover{background:var(--accent-soft)}
.bulk{border-color:var(--accent)}
.bulk.drag{background:var(--accent-soft)}
.linkbtn{color:var(--accent)}
.lang{border-color:var(--line)}
.lang button{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg{border-color:var(--line)}
.seg button{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.filters button{background:var(--field);border-color:var(--line);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.move button{border-color:var(--line);color:var(--ink)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.chip{background:var(--surface);color:var(--ink);border-color:var(--line)}
.chip.ok{background:#1f3d33;color:#7fe3c6}
.done{background:var(--surface);border-color:var(--accent)}
.notice{background:var(--warn-soft);color:var(--ink)}
.cropcard{background:var(--surface);color:var(--ink)}
.thumbs .t{border-color:var(--line)}
.toast{background:#f0f0ec;color:#1e1f22}
.deco{position:fixed;z-index:0;pointer-events:none;display:none}
@media (min-width:1180px){ .deco{display:block} }
.deco.dots{top:40px;left:32px;width:120px;color:var(--accent)}
.deco.wave{bottom:36px;right:32px;width:180px;color:var(--green)}
</style>

const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
const DRAFT = "glovo-menu-draft-v1";
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let lang = store.get("glovo-menu-lang") || "ka";
let state = store.get(DRAFT) || {shop:{name:"",email:"",phone:""},items:[]};
state.shop = Object.assign({name:"",email:"",phone:""}, state.shop);
state.skuMode = state.skuMode==="manual" ? "manual" : "auto";
if(!state.items.length) state.items.push(newItem());
// drafts saved before Section and SKU existed get empty values; uploads cut off by a reload count as failed
state.items.forEach(it=>{ it.section ??= ""; it.sku ??= "";
  it.photos.forEach(p=>{ if(p.status==="uploading"||p.status==="queued") p.status = p.url ? "ok" : "failed"; }); });
const inArtifact = !!(window.claude && window.claude.use);
// Sending needs the Netlify site (Netlify Forms); the claude.ai preview and a file opened from disk only download.
const canSend = !inArtifact && location.protocol==="https:";
let sending = false;
const apiKey = () => IMGBB_KEY || store.get("imgbb-key") || "";
let showErrors = false, pickTarget = null;
let filter = "all";      // product list filter: all | needs | ready
let preparing = null;    // {i,n} while bulk photos are being framed
let bulkInfo = null;     // {added,skipped} from the last bulk upload
let result = null;       // {send,dl} from the last submission

function newItem(){ return {id:uid(),name:"",desc:"",price:"",section:"",sku:"",photos:[]}; }
function t(k,...a){ const v=T[lang][k]; return typeof v==="function"?v(...a):v; }
function save(){ if(store.set(DRAFT,state)) return;
  // full storage: first drop the full-size copy of photos that are already online, then of every photo
  // (the page keeps the full copies in memory, so only a reload before uploading finishes loses quality)
  const slim = JSON.parse(JSON.stringify(state)); slim.items.forEach(i=>i.photos.forEach(p=>{ if(p.url) p.data = p.thumb; }));
  if(store.set(DRAFT,slim)) return;
  slim.items.forEach(i=>i.photos.forEach(p=>{ p.data = p.thumb; })); store.set(DRAFT,slim); }
let laterTimer;   // many uploads finish close together; redraw and save once for each burst
function later(){ if(laterTimer) return; laterTimer = setTimeout(()=>{ laterTimer = null; renderItems(); save(); }, 250); }

const pending = p => p.status==="uploading" || p.status==="queued";
function problems(it){
  const p = [];
  if(!it.name.trim()) p.push("needName");
  if(!(parsePrice(it.price) > 0)) p.push("needPrice");
  if(!it.photos.length) p.push("needPhoto");
  if(it.desc.length > DESC_MAX) p.push("tooLong");
  if(canHost() && it.photos.some(x=>!x.url && !pending(x))) p.push("failed");
  if(state.skuMode==="manual" && it.sku.trim() && state.items.some(o=>o!==it && o.sku.trim().toLowerCase()===it.sku.trim().toLowerCase())) p.push("dupSku");
  return p;
}
function parsePrice(v){ const n = parseFloat(String(v).replace(",",".").replace(/[^\d.]/g,"")); return isFinite(n) ? Math.round(n*100)/100 : NaN; }
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
const validPhone = v => v.replace(/\D/g,"").length >= 9;
function isBlank(it){ return !it.name.trim() && !String(it.price).trim() && !it.desc.trim() && !it.section.trim() && !it.sku.trim() && !it.photos.length; }
const isReady = it => !isBlank(it) && !problems(it).length;
// SKU for each product, in list order: the partner's own code when they chose to enter codes and wrote one,
// otherwise shop name + number (as before), skipping any number a partner's own code already uses.
function skuMap(items){
  const base = slug(state.shop.name).replace(/-/g,""), manual = state.skuMode==="manual";
  const used = new Set(manual ? items.map(i=>i.sku.trim().toLowerCase()).filter(Boolean) : []);
  const m = new Map(); let n = 0;
  for(const it of items){
    const own = manual && it.sku.trim();
    if(own){ m.set(it.id, {v:own, auto:false}); continue; }
    let v; do v = base + (++n); while(used.has(v)); m.set(it.id, {v, auto:true});
  }
  return m;
}

  // the middle word(s) of the headline get the blue accent, e.g. "შექმენით <თქვენი> მენიუ"
  const h1 = $("h1"), w = h1.textContent.trim().split(/\s+/);
  if(w.length>=3) h1.innerHTML = `${esc(w[0])} <span class="accent">${esc(w.slice(1,-1).join(" "))}</span> ${esc(w[w.length-1])}`;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#addBtn").textContent = t("add");
  $("#exportBtn").textContent = sending ? t("sending") : canSend ? t("previewSend") : t("previewDl");
  $("#downloadBtn").textContent = t("copy");
  $("#skuAuto").setAttribute("aria-pressed", state.skuMode==="auto"); $("#skuManual").setAttribute("aria-pressed", state.skuMode==="manual");
  $("#shopName").value = state.shop.name; $("#email").value = state.shop.email; $("#phone").value = state.shop.phone;
  const n = $("#hostNotice"); n.hidden = !!apiKey() && !inArtifact; n.innerHTML = t("demo");
  renderDone();
}
function chip(p){
  if(p.status==="queued") return `<span class="chip wait">${t("queued")}</span>`;
  if(p.status==="uploading") return `<span class="chip wait">${t("uploading")}</span>`;
  if(p.url) return `<span class="chip ok">${t("ready")}</span>`;
  if(p.status==="failed") return `<span class="chip bad">${t("failed")}</span>`;
  return `<span class="chip">${t("local")}</span>`;
}
const MISS = {needName:"missName", needPrice:"missPrice", needPhoto:"missPhoto"};
// Before the first send attempt, missing name/price/photo is a gentle hint; real errors show right away.
function softText(it){
  if(showErrors || isBlank(it)) return "";
  const m = problems(it).filter(k=>MISS[k]).map(k=>t(MISS[k]));
  return m.length ? t("missing", m.join(", ")) : "";
}
const errText = k => t(k==="failed" ? "photoFailedMsg" : k);

function renderItems(){
  // uploads redraw the list while the partner may be typing, so put the cursor back where it was
  const box = $("#items"), a = document.activeElement, inside = box.contains(a);
  const fid = inside && a.id ? a.id : null, sel = fid && typeof a.selectionStart==="number" ? [a.selectionStart, a.selectionEnd] : null;
  const keepId = inside ? a.closest(".item")?.dataset.id : null;
  const real = state.items.filter(i=>!isBlank(i)), sk = skuMap(real), ready = real.filter(isReady).length;
  const f = $("#filters"); f.hidden = real.length < 3;
  f.innerHTML = [["all",t("filterAll",state.items.length)],["needs",t("filterNeeds",state.items.length-ready)],["ready",t("filterReady",ready)]]
    .map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");
  if(f.hidden) filter = "all";
  const shown = state.items.map((it,i)=>[it,i]).filter(([it])=>filter==="all" || it.id===keepId || (filter==="ready")===isReady(it));
  box.innerHTML = shown.length ? shown.map(([it,i])=>card(it,i,sk)).join("") : `<p class="hint">${t("filterEmpty")}</p>`;
  renderSections();

}

/* ---------- photos ---------- */
function loadImage(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=e=>{URL.revokeObjectURL(u);rej(e);}; im.src=u; }); }
// Glovo wants square product photos; we send 540x540. The partner frames each photo in a square window:
// it opens filled edge to edge (center crop). Zooming out shows the whole photo, with the empty edges filled by a
// blurred copy of the photo (never plain white bars). "Remove background" cuts the product out on a clean color.
const OUT = 540, F = 540;
const BG_LIB = "bg-removal.js";   // bundled @imgly/background-removal 1.4.5, hosted next to this page
const BG_DATA = "https://staticimgly.com/@imgly/background-removal-data/1.4.5/dist/";   // free model files
const crop = {src:null, im:null, cut:null, mode:"keep", color:"#ffffff", s:1, min:1, cover:1, max:1, x:0, y:0, done:null, blur:null};
const dims = im => [im.naturalWidth||im.width, im.naturalHeight||im.height];
function cropClamp(){
  const [iw,ih] = dims(crop.im), w = iw*crop.s, h = ih*crop.s;
  crop.x = w <= F ? (F-w)/2 : Math.min(0, Math.max(F-w, crop.x));
  crop.y = h <= F ? (F-h)/2 : Math.min(0, Math.max(F-h, crop.y));
}
function makeBlur(im){ // tiny copy scaled back up reads as a soft blur in every browser
  const [iw,ih] = dims(im), c = document.createElement("canvas"); c.width = c.height = 18;
  const s = Math.max(18/iw, 18/ih), g = c.getContext("2d"); g.drawImage(im, (18-iw*s)/2, (18-ih*s)/2, iw*s, ih*s); return c;
}
// Idea from Sod's photo resizer: if the photo's edges are one plain color (a studio shot), extend that color into
// the margins so the result looks seamless; otherwise use the blurred copy.
function edgeColor(im){
  const [iw,ih] = dims(im), n = 64, c = document.createElement("canvas"); c.width = c.height = n;
  const g = c.getContext("2d"); g.drawImage(im,0,0,n,n); const d = g.getImageData(0,0,n,n).data, px = [];
  for(let i=0;i<n;i++) for(const [x,y] of [[i,0],[i,n-1],[0,i],[n-1,i]]){ const k=(y*n+x)*4; px.push([d[k],d[k+1],d[k+2]]); }
  const med = [0,1,2].map(ch=>px.map(p=>p[ch]).sort((a,b)=>a-b)[px.length>>1]);
  const share = px.filter(p=>Math.max(...p.map((v,ch)=>Math.abs(v-med[ch])))<=18).length/px.length;
  return share >= 0.85 ? `rgb(${med.join(",")})` : null;
}
// Shrinking a big phone photo straight to 540px in one step looks soft or jagged in most browsers, so halve it
// step by step first and do only the last small reduction in drawImage.
function halvedFor(im, scale){
  let src = im, [w,h] = dims(im);
  while(scale < 0.5){ const c = document.createElement("canvas"); c.width = Math.round(w/2); c.height = Math.round(h/2);
    const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.drawImage(src,0,0,c.width,c.height);
    src = c; w = c.width; h = c.height; scale *= 2; }
  return src;
}
function cropDraw(g, size, sharp, c=crop){
  const k = size/F, [iw,ih] = dims(c.im);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  if(c.mode==="cut"){ g.fillStyle = c.color; g.fillRect(0,0,size,size); }
  else if(c.edge){ g.fillStyle = c.edge; g.fillRect(0,0,size,size); }
  else { g.drawImage(c.blur, 0, 0, size, size); }
  g.drawImage(sharp ? halvedFor(c.im, c.s*k) : c.im, c.x*k, c.y*k, iw*c.s*k, ih*c.s*k);
}
function frameOut(c, size, q){ const cv=document.createElement("canvas"); cv.width=cv.height=size; cropDraw(cv.getContext("2d"),size,true,c); return cv.toDataURL("image/jpeg",q); }
// Bulk uploads skip the framing window: the whole photo goes in the square, edges filled the same way as when zoomed out.
function autoFrame(im){
  const [w,h] = dims(im), s = Math.min(F/w, F/h);
  const c = {im, mode:"keep", blur:makeBlur(im), edge:edgeColor(im), s, x:(F-w*s)/2, y:(F-h*s)/2};
  return {data:frameOut(c,OUT,.95), thumb:frameOut(c,240,.8)};
}
function cropRender(){
  cropDraw($("#cropCanvas").getContext("2d"), F);
  // crop.s above 1 means the photo is being enlarged to fill 540px, which is what makes it look blurry on Glovo
  $("#lowRes").hidden = crop.s <= 1.2;
}
function zoomTo(s, cx=F/2, cy=F/2){
  s = Math.min(crop.max, Math.max(crop.min, s));
  crop.x = cx - (cx-crop.x)*s/crop.s; crop.y = cy - (cy-crop.y)*s/crop.s; crop.s = s; cropClamp(); cropRender();
}
// slider 0..1000: first fifth goes from "whole photo" to "filled", the rest zooms in up to 4x
const sliderToScale = v => v<=200 ? crop.min+(crop.cover-crop.min)*v/200 : crop.cover*Math.pow(4,(v-200)/800);
const scaleToSlider = s => s<=crop.cover ? (crop.cover===crop.min?200:200*(s-crop.min)/(crop.cover-crop.min)) : 200+800*Math.log(s/crop.cover)/Math.log(4);
function useImage(im, startScale){
  const [w,h] = dims(im);
  Object.assign(crop, {im, min:Math.min(F/w,F/h), cover:Math.max(F/w,F/h)});
  crop.max = crop.cover*4; crop.s = startScale(crop); crop.x = (F-w*crop.s)/2; crop.y = (F-h*crop.s)/2; cropClamp();
  $("#zoom").value = scaleToSlider(crop.s); cropRender();
}
function setMode(mode){
  crop.mode = mode;
  $("#bgKeep").setAttribute("aria-pressed", mode==="keep"); $("#bgRemove").setAttribute("aria-pressed", mode==="cut");
  $("#swatches").hidden = mode!=="cut";
  document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed", b.dataset.c===crop.color));
  // a cut-out product sits whole in the square with a little air around it
  if(mode==="cut") useImage(crop.cut, c=>c.min*0.88), crop.min = Math.min(crop.min, crop.s);
  else useImage(crop.src, c=>c.cover);
}
// Clean the cut-out: drop faint pixels and stray specks (keep only blobs at least 10% the size of the main one),
// then trim the transparent edges so every product is centered the same way.
function cleanCutout(img){
  const [w,h] = dims(img), c = document.createElement("canvas"); c.width=w; c.height=h;
  const g = c.getContext("2d"); g.drawImage(img,0,0); const id = g.getImageData(0,0,w,h), d = id.data;
  const cell = Math.max(1, Math.ceil(Math.max(w,h)/240)), gw = Math.ceil(w/cell), gh = Math.ceil(h/cell);
  const solid = new Uint8Array(gw*gh);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const a=(y*w+x)*4+3; if(d[a]<40) d[a]=0; else if(d[a]>128) solid[((y/cell)|0)*gw+((x/cell)|0)]=1; }
  const lab = new Int32Array(gw*gh), sizes=[0];
  for(let i=0;i<solid.length;i++){ if(!solid[i]||lab[i]) continue;
    const id2 = sizes.length; let n=0, st=[i]; lab[i]=id2;
    while(st.length){ const j=st.pop(); n++; const x=j%gw, y=(j/gw)|0;
      for(const k of [x>0?j-1:-1, x<gw-1?j+1:-1, y>0?j-gw:-1, y<gh-1?j+gw:-1]) if(k>=0 && solid[k] && !lab[k]){ lab[k]=id2; st.push(k); } }
    sizes.push(n); }
  const big = Math.max(0,...sizes), keep = sizes.map(n=>n>=big*0.1);
  // a pixel survives if its grid cell (or a neighbouring one, for soft edges) belongs to a kept blob
  const near = new Uint8Array(gw*gh);
  for(let i=0;i<lab.length;i++) if(lab[i]&&keep[lab[i]]){ const x=i%gw, y=(i/gw)|0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy; if(xx>=0&&yy>=0&&xx<gw&&yy<gh) near[yy*gw+xx]=1; } }
  let x0=w, y0=h, x1=-1, y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const a=(y*w+x)*4+3; if(!d[a]) continue;
    if(!near[((y/cell)|0)*gw+((x/cell)|0)]){ d[a]=0; continue; }
    if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  g.putImageData(id,0,0);
  if(x1<0) return c;
  const o = document.createElement("canvas"); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext("2d").drawImage(c,-x0,-y0); return o;
}
let bgLib = null;
async function removeBg(){
  if(crop.cut){ setMode("cut"); return; }
  const src = crop.src, busy = $("#busy"); busy.textContent = t("removing"); busy.hidden = false; $("#cropOk").disabled = true; $("#bgRemove").disabled = true;
  try{
    bgLib = bgLib || await import(new URL(BG_LIB, location.href).href);
    const blob = await new Promise(r=>{ const c=document.createElement("canvas"); const [w,h]=dims(crop.src); const k=Math.min(1, 1600/Math.max(w,h));
      c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext("2d").drawImage(crop.src,0,0,c.width,c.height); c.toBlob(r,"image/png"); });
    const out = await bgLib.removeBackground(blob, {model:"small", publicPath:BG_DATA, output:{format:"image/png"}});
    if(!crop.done || crop.src!==src) return;
    crop.cut = cleanCutout(await loadImage(out));
    setMode("cut");
  }catch(e){ console.warn("background removal failed", e); toast(t("bgFailed")); }
  finally{ if(crop.src!==src) return; busy.hidden = true; $("#cropOk").disabled = false; $("#bgRemove").disabled = false; }
}
function cropDialog(im){

    $("#busy").hidden = true; $("#cropOk").disabled = false; $("#bgRemove").disabled = false;
    $("#bgRow").hidden = inArtifact;   // the model files cannot load inside claude.ai previews
    setMode("keep");
    $("#crop").hidden = false; $("#cropOk").focus();
  });
}
function cropClose(ok){
  $("#crop").hidden = true; $("#busy").hidden = true; const done = crop.done; crop.done = null; if(!done) return;
  if(!ok) return done(null);
  done({data:frameOut(crop,OUT,.95), thumb:frameOut(crop,240,.8)});
}
(()=>{
  const cv = $("#cropCanvas"); let drag=null;
  const pt = e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*F/r.width, y:(e.clientY-r.top)*F/r.height}; };
  cv.addEventListener("pointerdown", e=>{ cv.setPointerCapture(e.pointerId); const p=pt(e); drag={x:p.x-crop.x, y:p.y-crop.y}; });
  cv.addEventListener("pointermove", e=>{ if(!drag) return; const p=pt(e); crop.x=p.x-drag.x; crop.y=p.y-drag.y; cropClamp(); cropRender(); });

async function viaImgbb(key, data, name){

async function viaCloudinary(data, name){
  const fd = new FormData();
  fd.append("file", data);
  fd.append("upload_preset", CLOUDINARY_PRESET);
  const r = await fetch("https://api.cloudinary.com/v1_1/"+encodeURIComponent(CLOUDINARY_CLOUD)+"/image/upload", {method:"POST", body:fd});

function canHost(){ return !inArtifact && !!(apiKey() || (CLOUDINARY_CLOUD && CLOUDINARY_PRESET)); }
// Uploads wait in a queue and go three at a time, so 50 photos at once do not trip the hosts' rate limits.
const upQueue = []; let upActive = 0;
function upload(item, p){
  if(!canHost()){ p.status="local"; return; }
  p.status = "queued"; delete p.error; upQueue.push([item,p]); later(); pump();
}
function pump(){
  while(upActive < 3 && upQueue.length){
    const [item,p] = upQueue.shift(); if(!item.photos.includes(p)) continue;
    upActive++; uploadNow(item,p).finally(()=>{ upActive--; pump(); });
  }
}
// Last check before a photo leaves the device: Glovo shows 540x540, so anything else (e.g. the small preview that
// is all a full draft could keep after a reload) is redrawn to exactly 540x540, centered and cropped to a square.
async function ensure540(data){
  const im = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = data; });
  const [w,h] = dims(im); if(w===OUT && h===OUT) return data;
  const s = Math.max(OUT/w, OUT/h), c = document.createElement("canvas"); c.width = c.height = OUT;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.fillStyle = "#fff"; g.fillRect(0,0,OUT,OUT);
  g.drawImage(halvedFor(im, s), (OUT-w*s)/2, (OUT-h*s)/2, w*s, h*s);
  return c.toDataURL("image/jpeg", .95);
}
async function uploadNow(item, p){
  const key = apiKey(), cld = CLOUDINARY_CLOUD && CLOUDINARY_PRESET;
  p.status = "uploading"; later();
  const name = (state.shop.name+"-"+item.name).slice(0,60) || "product";
  try{
    p.data = await ensure540(p.data);
    try{ if(!key) throw new Error("no imgbb key"); p.url = await viaImgbb(key, p.data, name); }
    catch(e){ if(!cld) throw e; console.warn("imgbb failed, using Cloudinary", e); p.url = await viaCloudinary(p.data, name); }
    p.status = "ok"; p.data = p.thumb;
  }catch(e){
    p.status = "failed"; console.warn("upload failed", e);
    // a TypeError from fetch means the request never reached the host
    p.error = navigator.onLine===false || e instanceof TypeError ? "offline" : /rate|limit|429|too many/i.test(e && e.message) ? "busy" : "generic";
  }
  later();
}

const GE_LAT = {"ა":"a","ბ":"b","გ":"g","დ":"d","ე":"e","ვ":"v","ზ":"z","თ":"t","ი":"i","კ":"k","ლ":"l","მ":"m","ნ":"n","ო":"o","პ":"p","ჟ":"zh","რ":"r","ს":"s","ტ":"t","უ":"u","ფ":"p","ქ":"k","ღ":"gh","ყ":"q","შ":"sh","ჩ":"ch","ც":"ts","ძ":"dz","წ":"ts","ჭ":"ch","ხ":"kh","ჯ":"j","ჰ":"h"};
function slug(s){ return [...s.toLowerCase()].map(c=>GE_LAT[c]??c).join("").normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "shop"; }
function xml(s){ return esc(String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").trim()); }
const str = (ref,v,s) => v===""||v==null ? `<c r="${ref}"${s?` s="${s}"`:""}/>` : `<c r="${ref}"${s?` s="${s}"`:""} t="inlineStr"><is><t xml:space="preserve">${xml(v)}</t></is></c>`;
const num = (ref,v,s) => `<c r="${ref}" s="${s}"><v>${v}</v></c>`;
// Sod's layout drops the template's Unit/Step and Discounted Price columns, so products fill A-I and the rest stay styled blanks up to AL.
const FILL = ["J","K","L","M","N","O","P","Q","R","S","T","U","V","W","X","Y","Z","AA","AB","AC","AD","AE","AF","AG","AH","AI","AJ","AK","AL"];

async function buildXlsx(items){
  const zip = await JSZip.loadAsync(TEMPLATE_B64, {base64:true});
  const path = "xl/worksheets/sheet1.xml";
  let s = await zip.file(path).async("string");
  const base = slug(state.shop.name);
  s = s.replace('<c r="B2" s="3"/>', str("B2", base, 3))
       .replace('<c r="C2" s="5"/>', str("C2", COUNTRY, 5));
  const sku = skuMap(items);
  // B = SKU, I = "Section 1" (blank when the partner left it empty)
  const rows = items.map((it,i)=>{
    const r = 6+i;
    return `<row r="${r}" spans="1:38" ht="26.25" customHeight="1">`
      + str("A"+r,"Standard",20) + str("B"+r, sku.get(it.id).v, 21) + `<c r="C${r}" s="22"/>`
      + str("D"+r,it.name) + str("E"+r,it.photos.map(p=>p.url).filter(Boolean).join(",")) + str("F"+r,it.desc)
      + num("G"+r,parsePrice(it.price),26) + num("H"+r,1,27) + str("I"+r,it.section,23)
      + FILL.map(c=>`<c r="${c}${r}" s="3"/>`).join("") + `</row>`;
  }).join("");
  s = s.replace("</sheetData>", rows + "</sheetData>").replace('<dimension ref="A1:AL5"/>', `<dimension ref="A1:AL${5+items.length}"/>`);
  zip.file(path, s);
  return zip.generateAsync({type:"uint8array", compression:"DEFLATE", mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

// Finished menus are emailed to Sod through FormSubmit (free; the first submission sends Sod an activation email).
// A copy also goes to Netlify Forms when form detection is on for the site. Either one arriving counts as sent.
const SEND_TO = "gecategorymanagers@glovoapp.com";
// Google Apps Script web app (google-apps-script.gs, setup steps at its top). When set, it is used instead of
// FormSubmit: it saves every menu in a Drive folder, logs it in a Google Sheet, emails the Excel as an attachment
// and reports real success or failure. If it fails, the page falls back to FormSubmit so the menu still arrives.
const MAIL_URL = "";
function toBase64(bytes){ let s = ""; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s); }
async function emailViaAppsScript(payload){
  // text/plain keeps this a simple request, so the browser sends it without a CORS preflight Apps Script cannot answer
  const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 60000);
  try{
    const r = await fetch(MAIL_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), signal:ctl.signal});
    const j = await r.json().catch(()=>({}));
    if(!j.ok) throw new Error(j.error || ("HTTP "+r.status));
  } finally { clearTimeout(timer); }
}
function emailViaFormSubmit(fields, file){
  // FormSubmit takes attachments only from a regular form post, so post a hidden form into a hidden frame.
  return new Promise((resolve, reject)=>{
    const name = "fs" + Date.now(), frame = document.createElement("iframe"), form = document.createElement("form");
    frame.name = name; frame.hidden = true; document.body.appendChild(frame);
    Object.assign(form, {method:"POST", enctype:"multipart/form-data", action:"https://formsubmit.co/"+encodeURIComponent(SEND_TO), target:name, hidden:true});
    for(const [k,v] of Object.entries(fields)){ const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = v; form.appendChild(i); }
    const fi = document.createElement("input"); fi.type = "file"; fi.name = "attachment";
    const dt = new DataTransfer(); dt.items.add(file); fi.files = dt.files; form.appendChild(fi);
    document.body.appendChild(form);
    const done = ok=>{ clearTimeout(timer); setTimeout(()=>{ frame.remove(); form.remove(); }, 1000); ok ? resolve() : reject(new Error("email timeout")); };
    const timer = setTimeout(()=>done(false), 45000);
    frame.addEventListener("load", ()=>done(true), {once:true});
    form.submit();
  });
}
async function saveToNetlify(fields, file){
  const fd = new FormData(); fd.append("form-name", "menu-submission");
  for(const [k,v] of Object.entries(fields)) fd.append(k, v);
  fd.append("excel", file);
  const r = await fetch("/", {method:"POST", body:fd});
  if(!r.ok) throw new Error("HTTP "+r.status);
}
// Company mail often blocks .xlsx attachments, so the Excel also goes to Cloudinary and the Netlify Forms
// notification email carries its public link ("excel-link").
async function excelLink(file){
  if(!(CLOUDINARY_CLOUD && CLOUDINARY_PRESET)) return "";
  const post = async withId=>{
    const fd = new FormData();
    fd.append("file", file); fd.append("upload_preset", CLOUDINARY_PRESET);
    if(withId) fd.append("public_id", file.name.replace(/\.xlsx$/i,"")+"-"+Date.now()+".xlsx");
    const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 30000);
    try{
      const r = await fetch("https://api.cloudinary.com/v1_1/"+encodeURIComponent(CLOUDINARY_CLOUD)+"/raw/upload", {method:"POST", body:fd, signal:ctl.signal});
      const j = await r.json();
      if(!j.secure_url) throw new Error(j.error && j.error.message || r.status);
      return j.secure_url;
    } finally { clearTimeout(timer); }
  };
  try{ return await post(true); }
  catch(e){ console.warn("excel link with name failed", e); try{ return await post(false); } catch(e2){ console.warn("excel link failed", e2); return ""; } }
}
// Throws when the menu did not reach Sod; Error("offline") when the partner has no connection.
async function deliver(wb){
  const file = new File([wb.bytes], wb.filename, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const cur = CURRENCY[COUNTRY] || "", sku = skuMap(wb.items);
  const line = it => `${it.name.trim()} - ${parsePrice(it.price)} ${cur}` + (it.section.trim() ? ` [${it.section.trim()}]` : "") + ` (SKU ${sku.get(it.id).v})`;
  const list = wb.items.map((it,i)=>`${i+1}. ${line(it)}`).join("\n");
  const venue = {venue:state.shop.name.trim(), email:state.shop.email.trim(), phone:state.shop.phone.trim(), products:String(wb.items.length)};
  const link = await excelLink(file);
  if(MAIL_URL){
    try{
      await emailViaAppsScript({shop:venue.venue, email:venue.email, phone:venue.phone, count:venue.products,
        products:wb.items.map(line), filename:wb.filename, file:toBase64(wb.bytes)});
      saveToNetlify({...venue, "product-list":list, "excel-link":link || "(upload failed, file attached in Netlify)"}, file).catch(()=>{});
      return;
    }catch(e){ console.warn("Apps Script failed, falling back to FormSubmit", e); }
  }
  const results = await Promise.allSettled([
    // FormSubmit sets Reply-To from the "email" field, so Sod can answer the partner straight from the email.
    emailViaFormSubmit({"Shop name":venue.venue, email:venue.email, "Phone number":venue.phone, "Number of products":venue.products, "Products":list,
      _subject:`New Glovo menu: ${venue.venue} (${venue.products} products)`, _captcha:"false", _template:"table"}, file),
    saveToNetlify({...venue, "product-list":list, "excel-link":link || "(upload failed, file attached in Netlify)"}, file)
  ]);
  // The email frame cannot tell success from a dropped connection, so a network failure on the Netlify call
  // (a TypeError, not an HTTP error) means the partner is offline and nothing went out.
  if(results[1].status==="rejected" && results[1].reason instanceof TypeError) throw new Error("offline");
  if(!results.some(r=>r.status==="fulfilled")) throw results[0].reason;
}
// Downloads the partner's backup copy first (so they have it even if sending fails), then sends.

async function submitMenu(wb, retry){

    else try{ await deliver(wb); }catch(e){ console.warn("send failed", e); send = e && e.message==="offline" ? "offline" : "failed"; }
    result = {send, dl};
    if(send==="ok") markSent();
  } finally {
    sending = false; renderStatic(); renderSummary();
    $("#donePanel").scrollIntoView({behavior:"smooth", block:"center"});
  }
}

// a photo dropped outside a drop area would otherwise open in the tab and leave the page
window.addEventListener("dragover", e=>e.preventDefault());
window.addEventListener("drop", e=>e.preventDefault());
$("#pmMain").onclick = ()=>photoAction("main"); $("#pmRemove").onclick = ()=>photoAction("remove");
$("#pmReplace").onclick = ()=>photoAction("replace"); $("#pmRetry").onclick = ()=>photoAction("retry");
$("#pmClose").onclick = closePhotoMenu;
document.addEventListener("keydown", e=>{ if(e.key!=="Escape") return; if(!$("#pmenu").hidden) closePhotoMenu(); else if(!$("#preview").hidden) closePreview(); });
$("#newMenuBtn2").onclick = startNewMenu;
$("#resetBtn").onclick = ()=>{ $("#resetBtn").hidden = true; $("#resetConfirm").hidden = false; };
$("#resetNo").onclick = ()=>{ $("#resetBtn").hidden = false; $("#resetConfirm").hidden = true; };
$("#resetYes").onclick = startNewMenu;

const items = $("#items");
items.addEventListener("input", e=>{
  const k = e.target.dataset.k, it = itemOf(e.target); if(!k||!it) return;
  it[k] = e.target.value; e.target.classList.remove("invalid");
  if(k==="desc"){ const c=e.target.parentElement.querySelector(".count"); c.textContent=`${it.desc.length} / ${DESC_MAX}`; c.classList.toggle("over", it.desc.length>DESC_MAX); }
  save(); renderSummary(); refreshCard(it);
});
// SKU numbers and the duplicate check depend on other products, so redraw once the partner leaves the field
items.addEventListener("change", e=>{ if(e.target.dataset.k==="sku") setTimeout(renderItems); else if(e.target.dataset.k==="section") renderSections(); });
items.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return; const it = itemOf(b);
  const act = b.dataset.act;
  if(act==="photo"){
    if(it.photos.length) openPhotoMenu(it, it.photos[0].id);
    else { pickTarget = {item:it}; $("#fileInput").click(); }
  } else if(act==="pmenu"){ openPhotoMenu(it, b.dataset.pid); }
  else if(act==="more"){ pickTarget = {item:it}; $("#fileInput").click(); }
  else if(act==="up" || act==="down"){
    const i = state.items.indexOf(it), j = act==="up" ? i-1 : i+1; if(j<0 || j>=state.items.length) return;
    [state.items[i], state.items[j]] = [state.items[j], state.items[i]]; save(); renderItems();
    (document.querySelector(`[data-id="${it.id}"] [data-act="${act}"]:not(:disabled)`) || document.querySelector(`[data-id="${it.id}"] .move button:not(:disabled)`))?.focus();
  }
  else if(act==="askremove"){ it.askDelete = true; renderItems(); }
  else if(act==="keep"){ delete it.askDelete; renderItems(); }
  else if(act==="remove"){ state.items = state.items.filter(x=>x!==it); save(); renderItems(); }
});
items.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("photo")){ e.preventDefault(); e.target.click(); } });
items.addEventListener("dragover", e=>{ const p=e.target.closest(".photo"); if(p){ e.preventDefault(); p.classList.add("drag"); } });
items.addEventListener("dragleave", e=>{ e.target.closest(".photo")?.classList.remove("drag"); });
items.addEventListener("drop", e=>{ const p=e.target.closest(".photo"); if(!p) return; e.preventDefault(); addPhotos(itemOf(p), [...e.dataTransfer.files]); });
$("#fileInput").onchange = e=>{ if(pickTarget) addPhotos(pickTarget.item,[...e.target.files],pickTarget.replace); e.target.value=""; e.target.multiple = true; };

// Hidden setup panel for Sod: open the page with #setup to paste the photo hosting key for testing.
function checkSetup(){ const on = location.hash==="#setup"; $("#settings").hidden=!on; if(on) $("#keyInput").value = store.get("imgbb-key")||""; }
$("#keyInput").oninput = e=>{ store.set("imgbb-key", e.target.value.trim()); renderStatic(); };
window.addEventListener("hashchange", checkSetup);
checkSetup(); renderAll();
</script>
</body></html>
